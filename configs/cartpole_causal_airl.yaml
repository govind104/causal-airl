env:
  name: "CartPole"
  confounder_values: [0.5, 2.0]
  confounded: true
  stochastic: true
  state_representation: "continuous"

expert:
  num_trajectories: 25
  optimality: "optimal"
  confounder_value: null

irl:
  method: "causal_airl"
  gamma: 0.99
  horizon: 200
  max_iters: 50
  lr: 0.0003
  latent_dim: 3
  num_z_samples: 2
  invariance_penalty: 0.1
  kl_weight_start: 0.05
  kl_weight_end: 1.0
  use_latent: true
  reward_input: "state_action"
  use_shaping: true

train:
  batch_size: 32
  epochs: 1
  seed: 42
  verbose: false

eval:
  test_z: null
  plot: false
  generalisation: true
  save_dir: "results/cartpole/"
