env:
  name: "GridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0
  terminal_states: [[4, 4]]
  confounded: false
  state_representation: "onehot"

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0

irl:
  method: "airl"
  gamma: 0.99
  horizon: 100
  max_iters: 200
  lr: 0.0003
  l1_bound: 1.0
  entropy_coef: 0.01
  disc_steps_per_policy_step: 5
  
train:
  batch_size: 64
  epochs: 3
  seed: 42
  verbose: false

eval:
  test_z: null
  plot: true
  generalisation: false
  save_dir: "results/gridworld_baselines/"
