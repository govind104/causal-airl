env:
  name: "GridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0
  terminal_states: [[4, 4]]

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0

irl:
  method: "ng"
  gamma: 0.9
  max_iters: 100
  lr: 0.01
  l1_bound: 1.0
  use_sparse_constraints: true  # Enable sparse LP constraints

train:
  batch_size: 64
  epochs: 3
  seed: 42

eval:
  test_z: null
  save_dir: "results/gridworld_baselines/"
  gen_trajectories: true
  heldout_region: null
  save_per_z: false
  save_value_function: true
  skip_value_iteration: false
