env:
  name: "GridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0
  terminal_states: [[4, 4]]
  confounded: false
  state_representation: "onehot"

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0

irl:
  method: "maxent"
  gamma: 0.9
  horizon: 200
  max_iters: 100
  lr: 0.1
  momentum: 0.8
  reg_lambda: 0.0001
  l1_bound: 1.0
  normalize_features: true
  temperature: 1.0
  reward_scale: 1.0
  use_sparse_constraints: true  # Enable sparse LP constraints

train:
  batch_size: 64
  seed: 42
  verbose: false

eval:
  test_z: null
  plot: true
  generalisation: false
  save_dir: "results/gridworld_baselines/"
  gen_trajectories: true      # Disable trajectory generation
  skip_value_iteration: false   # Skip value iteration in evaluation