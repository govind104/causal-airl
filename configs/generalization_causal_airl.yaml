env:
  name: "ConfoundedGridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  slip_prob: 0.1
  terminal_states: [[4, 4]]
  confounded: true
  state_representation: "onehot"

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0  # Train on z=0

irl:
  method: "causal_airl"
  gamma: 0.99
  horizon: 100
  max_iters: 300
  lr: 0.01
  latent_dim: 2
  num_z_samples: 5
  invariance_penalty: 0.1
  kl_weight_start: 0.1
  kl_weight_end: 1.0
  use_latent: true
  reward_input: "state"

train:
  batch_size: 64
  epochs: 3
  seed: 42
  verbose: false

eval:
  test_z: 1  # Test on z=1
  plot: true
  generalisation: true
  perturbations: true
  save_dir: "results/generalization/"