env:
  name: "GridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0  # Will be overridden in sweeps
  terminal_states: [[4, 4]]
  confounded: false
  state_representation: "onehot"

expert:
  num_trajectories: 20  # Will be overridden in sweeps
  optimality: "optimal"
  confounder_value: 0

irl:
  method: "airl"  # Will be overridden in sweeps
  gamma: 0.99      # Will be overridden in sweeps
  horizon: 100
  max_iters: 100
  lr: 0.01
  latent_dim: 2
  invariance_penalty: 0.1
  reward_input: "state"

train:
  batch_size: 64
  epochs: 3
  seed: 42
  verbose: true

eval:
  test_z: null
  plot: true
  generalisation: false
  save_dir: "results/airl_ablation/"
