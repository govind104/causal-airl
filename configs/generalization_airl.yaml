env:
  name: "ConfoundedGridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0
  terminal_states: [[4, 4]]
  confounder_value: 0
  
expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0  # Train on z=0

irl:
  method: "airl"
  gamma: 0.99
  max_iters: 200
  lr: 0.0003
  entropy_coef: 0.005
  grad_clip_norm: 0.5
  reward_logit_clip: null

train:
  batch_size: 64
  epochs: 3
  seed: 42

eval:
  test_z: null  # Test on z=1
  save_dir: "results/generalization/"
  gen_trajectories: true
  heldout_region: null
  save_per_z: true
  save_value_function: true
  skip_value_iteration: false
