env:
  name: "ConfoundedGridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.1
  terminal_states: [[4, 4]]
  confounded: true
  confounder_value: 0
  state_representation: "onehot"

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0  # Train on z=0

irl:
  method: "airl"
  gamma: 0.99
  horizon: 100
  max_iters: 300
  lr: 0.01
  latent_dim: 2
  invariance_penalty: 0.1
  entropy_coef: 0.01
  disc_steps_per_policy_step: 5
  reward_input: "state"

train:
  batch_size: 64
  epochs: 3
  seed: 42
  verbose: false

eval:
  test_z: 1  # Test on z=1
  plot: true
  generalisation: true
  perturbations: true
  save_dir: "results/generalization/"
