env:
  name: "CartPole"
  confounder_values: [0.5, 1.0]
  confounded: true
  state_representation: "continuous"

expert:
  num_trajectories: 25
  optimality: "optimal"
  confounder_value: null

irl:
  method: "airl"
  gamma: 0.99
  horizon: 200
  max_iters: 500
  lr: 0.0003
  latent_dim: 4
  invariance_penalty: 0.2
  reward_input: "state_action"
  use_shaping: true

train:
  batch_size: 128
  epochs: 10
  seed: 123
  verbose: true

eval:
  test_z: null
  plot: false
  generalisation: true
  save_dir: "results/cartpole/"