env:
  name: "CartPole"
  confounder_values: [0.5, 1.0]
  confounded: true
  stochastic: true
  state_representation: "continuous"

expert:
  num_trajectories: 25
  optimality: "optimal"
  confounder_value: null

irl:
  method: "airl"
  gamma: 0.99
  horizon: 200
  max_iters: 500
  lr: 0.0003
  entropy_coef: 0.005
  l1_bound: 1.0
  grad_clip_norm: 0.5
  hidden_dim: 64        # AIRLDiscriminator hidden layer size
  l2_reg: 1e-4         # L2 regularization for discriminator
  reward_logit_clip: null
  device: null

train:
  batch_size: 128
  epochs: 4
  seed: 42
  verbose: false

eval:
  test_z: null
  plot: false
  generalisation: true
  save_dir: "results/cartpole/"
  gen_trajectories: true
  heldout_region: null
  heldout_mask_indices: null
  save_per_z: true
  save_value_function: true
  skip_value_iteration: false
