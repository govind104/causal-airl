env:
  name: "CartPole"
  confounder_values: [0.5, 1.0]
  confounded: true
  stochastic: false
  state_representation: "continuous"

expert:
  num_trajectories: 25
  optimality: "optimal"
  confounder_value: null

irl:
  method: "airl"
  gamma: 0.99
  horizon: 200
  max_iters: 50
  lr: 0.0003
  latent_dim: 4
  invariance_penalty: 0.2
  reward_input: "state_action"
  use_shaping: true
  entropy_coef: 0.005            # Lower entropy to stabilize SAC policy
  disc_steps_per_policy_step: 10 # Helps discriminator in high-dim setting

train:
  batch_size: 32
  epochs: 1
  seed: 42
  verbose: false

eval:
  test_z: null
  plot: false
  generalisation: true
  save_dir: "results/cartpole/"
