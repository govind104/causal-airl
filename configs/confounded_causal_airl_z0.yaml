env:
  name: "ConfoundedGridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  reward_value: 1.0
  slip_prob: 0.0
  terminal_states: [[4, 4]]
  confounder_value: 0

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0  # Train on z=0

irl:
  method: "causal_airl"
  gamma: 0.99
  max_iters: 200
  lr: 0.0003
  latent_dim: 2
  num_z_samples: 5
  kl_coeff: 0.003
  kl_warmup_epochs: 100
  kl_clamp_max: 10.0
  entropy_coef: 0.005
  grad_clip_norm: 0.5
  inv_coeff: 0.02
  q_warmstart:
    enabled: false
    epochs: 1
    lr: null           # if null, reuse irl.lr
    weight_decay: 0.0
    num_trajs_per_z: 5
    batch_size: null   # if null, reuse train.batch_size
    z_num_classes: 2
    pos_weight: null   # for binary; if null, compute N_neg/N_pos
    class_weight: null # for multi-class; if null, inverse-frequency weights
  reward_input: "state"
  use_latent: true            # Toggle causal mode
  reward_logit_clip: null  # set to e.g. 10.0 to enable guard

train:
  batch_size: 64
  epochs: 3
  seed: 42

eval:
  test_z: null
  save_dir: "results/confounded/"
  gen_trajectories: true
  heldout_region: null
  save_per_z: true
  save_value_function: true
  skip_value_iteration: false
