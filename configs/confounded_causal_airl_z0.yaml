env:
  name: "ConfoundedGridWorld"
  grid_size: [5, 5]
  reward_type: "sparse"
  slip_prob: 0.1
  terminal_states: [[4, 4]]
  confounded: true
  state_representation: "onehot"

expert:
  num_trajectories: 20
  optimality: "optimal"
  confounder_value: 0  # Train on z=0

irl:
  method: "causal_airl"
  gamma: 0.99
  horizon: 100
  max_iters: 100
  lr: 0.01
  latent_dim: 2
  invariance_penalty: 0.1
  reward_input: "state"

train:
  batch_size: 64
  seed: 42
  verbose: true

eval:
  test_z: null
  plot: true
  generalisation: true
  save_dir: "results/confounded/"